name: Crear APK de Android

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Crear buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Viyuva
        package.name = viyuva
        package.domain = org.viyuva
        source.dir = .
        source.include_exts = py,png,json
        version = 0.1
        requirements = python3,kivy
        orientation = portrait
        fullscreen = 0
        icon.filename = %(source.dir)s/logo.png

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Compilar APK con Buildozer Action
      uses: ArtemShedov/buildozer-action@v1.2.0
      with:
        command: buildozer -v android debug
        buildozer_version: master

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: Viyuva-APK
        path: bin/*.apk
        
        
