name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config cmake gettext \
            build-essential libsqlite3-dev zlib1g-dev libncurses5-dev libgdbm-dev \
            libnss3-dev libssl-dev libreadline-dev libffi-dev libbz2-dev liblzma-dev \
            openjdk-17-jdk unzip zip scons git
        pip install --upgrade buildozer cython==0.29.33

    - name: Create buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Viyuva
        package.name = viyuva
        package.domain = org.viyuva
        source.dir = .
        source.include_exts = py,png,json
        version = 0.1
        requirements = python3,kivy
        orientation = portrait
        fullscreen = 0
        icon.filename = %(source.dir)s/logo.png

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: Viyuva-APK
        path: bin/*.apk
        
